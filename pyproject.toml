[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-research-rag-mcp"
version = "0.3.0"
description = "Evidence-grounded research lifecycle tools over MCP Streamable HTTP"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
 "pypdf==6.18.1",
 "uvicorn==0.52.4",
 "numpy==2.3.5",
 "qdrant-client==1.18.0",
 "ollama>=0.1.0",
 "pythainlp>=3.1.0",
 "rank-bm25==0.2.2",
 "portalocker>=3.0",
 "openai>=1.0.0",
 "PyMuPDF>=1.23.0",
]

[project.scripts]
research-rag = "research_rag_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_rag_mcp", "src/pyragdoc"]
